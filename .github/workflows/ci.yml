name: Validate Mossline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/**", "refactor/**"]
# Run feature validation on pull requests, not twice for both push and PR.
concurrency:
  group: mossline-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Postgres lets the browser tests sign in and publish; sign-in links go to files, never email.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mossline
          POSTGRES_PASSWORD: mossline
          POSTGRES_DB: mossline_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mossline" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MOSSLINE_HOSTED_PUBLISHING_ENABLED: "true"
      MOSSLINE_SHARED_MAPS_ENABLED: "true"
      MOSSLINE_PLANS_ENABLED: "true"
      MOSSLINE_ADMINS: operator@example.net
      MOSSLINE_OPERATOR_NAME: Mossline CI
      MOSSLINE_OPERATOR_EMAIL: ci@example.net
      # Test values only: enough to accept signed webhook events. Nothing contacts Stripe in CI.
      MOSSLINE_STRIPE_SECRET_KEY: ci-placeholder-not-a-key
      MOSSLINE_STRIPE_PRICE_ID: ci-placeholder-price
      MOSSLINE_STRIPE_WEBHOOK_SECRET: ci-placeholder-webhook-secret
      MOSSLINE_DATABASE_URL: postgres://mossline:mossline@127.0.0.1:5432/mossline_ci
      MOSSLINE_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      MOSSLINE_BASE_URL: http://127.0.0.1:3000
      MOSSLINE_PUBLISHERS: "@example.net"
      MOSSLINE_EMAIL_FROM: Mossline CI <ci@example.net>
      MOSSLINE_TEST_MAIL_DIR: /tmp/mossline-mail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run graph tests
        run: npm run test
      - name: Typecheck packages
        run: npm run typecheck
      - name: Build web app
        run: npm run build

      - name: Prepare the publishing database
        run: |
          for f in apps/web/migrations/*.sql; do
            PGPASSWORD=mossline psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U mossline -d mossline_ci -f "$f"
          done
      - name: Install headless browser
        timeout-minutes: 7
        # The Ubuntu hosted runner already carries the Chromium runtime libs.
        # Avoid apt package upgrades that can hang unrelated to the app.
        run: npx playwright install chromium --only-shell
      - name: Smoke-test the product and accessibility
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
