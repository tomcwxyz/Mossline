name: Validate Mossline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# Run feature validation on pull requests, not twice for both push and PR.
concurrency:
  group: mossline-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run graph tests
        run: npm run test
      - name: Typecheck packages
        run: npm run typecheck
      - name: Build web app
        run: npm run build

      - name: Install headless browser
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the product and accessibility
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
