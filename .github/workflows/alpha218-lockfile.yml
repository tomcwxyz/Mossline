name: Alpha 2.18 one-off lockfile generation
on:
  push:
    branches: [feat/alpha-2-18-quality-and-recovery]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate reproducible npm dependency resolution
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to this feature branch only
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: commit resolved npm dependency lockfile"
          git push origin HEAD:refs/heads/feat/alpha-2-18-quality-and-recovery
